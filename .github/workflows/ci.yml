name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: CGO_ENABLED=0 go test -race=false ./...
      - run: go test -race ./...
        if: runner.os == 'Linux' && runner.arch == 'X64'
      - run: go vet ./... && go test ./...
        working-directory: diskfs
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./...
      - run: GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build ./...

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./apm, name: FuzzRead }
          - { pkg: ./hfsplus, name: FuzzVolumeHeader }
          - { pkg: ./hfsplus, name: FuzzBTreeNode }
          - { pkg: ./hfsplus, name: FuzzJournal }
          - { pkg: ./hfsplus, name: FuzzDecmpfs }
          - { pkg: ./hfsplus, name: FuzzNameToHFS }
          - { pkg: ./lzvn, name: FuzzDecode }
          - { pkg: ./lzfse, name: FuzzDecode }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go test -run='^$' -fuzz='^${{ matrix.target.name }}$' -fuzztime=10m ${{ matrix.target.pkg }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-${{ matrix.target.name }}
          path: '**/testdata/fuzz/**'
