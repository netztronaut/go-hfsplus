# CI on git.stei.gr. Forgejo reads .forgejo/workflows instead of .github/workflows, which stays for
# GitHub: its runner labels (ubuntu-24.04-arm, macos-latest) do not exist here.
#
#   test   Linux (ubuntu-latest): gofmt, vet, the tests with and without the race detector, the
#          diskfs module, and cross-builds.
#   macos  The tests in the macOS guest beside the macos-x86_64 runner (Tahoe), over ssh and the 9p
#          share, as the other macos components reach it (.forgejo/ci/runner-guest.sh, guest.sh);
#          there the lzfse and lzvn tests also compare with macOS's own compression_tool.
#   fuzz   Every fuzz target, one after another in one job so a push does not hold the shared
#          runner with eight: 30 seconds each on a push or pull request, the ten minutes PLAN.md asks
#          for each weekly and on a manual run.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: CGO_ENABLED=0 go test ./...
      - run: go test -race ./...
      - run: go vet ./... && go test ./...
        working-directory: diskfs
      - run: |
          for target in linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "$target"
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build ./...
          done

  macos:
    runs-on: macos-x86_64
    timeout-minutes: 30
    steps:
      - name: Clone
        run: |
          rm -rf src
          git init -q src
          git -C src -c http.extraHeader="Authorization: bearer ${{ forgejo.token }}" \
            fetch -q --depth 1 "${{ forgejo.server_url }}/${{ forgejo.repository }}.git" "${{ forgejo.ref }}"
          git -C src checkout -q FETCH_HEAD
          git -C src log -1 --format='%h %s'
      - name: Test in the macOS guest
        run: sh src/.forgejo/ci/runner-guest.sh

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fuzz
        run: |
          case "${{ forgejo.event_name }}" in
          schedule | workflow_dispatch) fuzztime=10m ;;
          *) fuzztime=30s ;;
          esac
          status=0
          for target in ./apm:FuzzRead ./hfsplus:FuzzVolumeHeader ./hfsplus:FuzzBTreeNode \
            ./hfsplus:FuzzJournal ./hfsplus:FuzzDecmpfs ./hfsplus:FuzzNameToHFS \
            ./lzvn:FuzzDecode ./lzfse:FuzzDecode; do
            pkg=${target%%:*} name=${target#*:}
            echo "::group::$pkg $name ($fuzztime)"
            go test -run='^$' -fuzz="^$name\$" -fuzztime="$fuzztime" "$pkg" || status=1
            echo "::endgroup::"
          done
          exit $status
      - uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: fuzz-corpus
          path: "**/testdata/fuzz/**"
